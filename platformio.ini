[platformio]
default_envs = cardputer

[env:cardputer]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTASCA_VERSION=\"0.1.0\"
; Transitive dependencies are listed too so that every version is pinned.
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    z3t0/IRremote@4.7.1
; The Cardputer's native USB shows up as /dev/cu.usbmodem* on macOS; restricting
; the pattern keeps auto-detection away from Bluetooth serial ports.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200

; Host tests: only the hardware-free code under src/core/ is compiled.
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1
test_build_src = yes
build_src_filter = -<*> +<core/>
